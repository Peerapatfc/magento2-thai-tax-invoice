<div class="thai-tax-invoice" data-bind="visible: isEnabled">
    <div class="field choice">
        <input type="checkbox" id="thai-tax-invoice-requested" name="thai_tax_invoice_requested"
               class="checkbox"
               data-bind="checked: requested, event: {change: onToggle}">
        <label class="label" for="thai-tax-invoice-requested">
            <span translate="'I want a full tax invoice'"></span>
        </label>
    </div>
    <div class="thai-tax-invoice-fields" data-bind="visible: requested">
        <div class="message error" data-bind="visible: error, text: error"></div>
        <div class="field field-type">
            <span class="label" translate="'Invoice for'"></span>
            <div class="thai-tax-invoice-types">
                <label for="thai-tax-invoice-type-company">
                    <input type="radio" id="thai-tax-invoice-type-company" name="thai_tax_invoice_type" value="company"
                           data-bind="checked: type">
                    <span translate="'Company'"></span>
                </label>
                <label for="thai-tax-invoice-type-individual">
                    <input type="radio" id="thai-tax-invoice-type-individual" name="thai_tax_invoice_type" value="individual"
                           data-bind="checked: type">
                    <span translate="'Individual'"></span>
                </label>
            </div>
        </div>
        <div class="field required field-wide">
            <label class="label" for="thai-tax-invoice-name">
                <span data-bind="visible: isCompany" translate="'Company name, as registered'"></span>
                <span data-bind="visible: !isCompany()" translate="'First and last name'"></span>
            </label>
            <div class="control">
                <input type="text" id="thai-tax-invoice-name" class="input-text" maxlength="255"
                       data-bind="value: buyerName, valueUpdate: 'afterkeydown'">
            </div>
        </div>
        <div class="field choice field-wide">
            <input type="checkbox" id="thai-tax-invoice-vat" class="checkbox" data-bind="checked: vatRegistered">
            <label class="label" for="thai-tax-invoice-vat">
                <span translate="'Registered for VAT (needed to claim input tax)'"></span>
            </label>
        </div>
        <div class="field" data-bind="css: {required: vatRegistered, 'field-wide': notVatRegistered}">
            <label class="label" for="thai-tax-invoice-tax-id">
                <span data-bind="visible: vatRegistered" translate="'Tax ID (13 digits)'"></span>
                <span data-bind="visible: notVatRegistered" translate="'National ID or tax ID (13 digits, optional)'"></span>
            </label>
            <div class="control">
                <input type="text" id="thai-tax-invoice-tax-id" class="input-text" maxlength="20" inputmode="numeric"
                       data-bind="value: taxId, valueUpdate: 'afterkeydown'">
            </div>
        </div>
        <div class="field required" data-bind="visible: vatRegistered">
            <label class="label" for="thai-tax-invoice-branch"><span translate="'Branch code (00000 = head office)'"></span></label>
            <div class="control">
                <input type="text" id="thai-tax-invoice-branch" class="input-text" maxlength="5" inputmode="numeric"
                       data-bind="value: branch, valueUpdate: 'afterkeydown'">
            </div>
        </div>
        <div class="field choice field-wide">
            <input type="checkbox" id="thai-tax-invoice-same-address" class="checkbox" data-bind="checked: sameAddress">
            <label class="label" for="thai-tax-invoice-same-address">
                <span translate="'Use my billing address on the invoice'"></span>
            </label>
        </div>
        <div class="field required field-wide" data-bind="visible: differentAddress">
            <label class="label" for="thai-tax-invoice-address"><span translate="'Address on the invoice (as registered)'"></span></label>
            <div class="control">
                <textarea id="thai-tax-invoice-address" class="input-text" rows="3" maxlength="500"
                          data-bind="value: address, valueUpdate: 'afterkeydown'"></textarea>
            </div>
        </div>
    </div>
</div>
